<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Computer Networks Quiz - Part 2</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* نفس الـ CSS الموجود في quiz1.html */
      :root {
        --navy: #0d1b2a;
        --navy2: #1b2d42;
        --teal: #00c9a7;
        --teal-dim: rgba(0, 201, 167, 0.12);
        --red: #ff4d6d;
        --red-dim: rgba(255, 77, 109, 0.12);
        --gold: #f5a623;
        --white: #f0f4f8;
        --muted: #8899aa;
        --card: #162032;
        --border: rgba(255, 255, 255, 0.07);
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--navy);
        color: var(--white);
        font-family: "DM Sans", sans-serif;
        min-height: 100vh;
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(0, 201, 167, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 201, 167, 0.03) 1px, transparent 1px);
        background-size: 40px 40px;
        pointer-events: none;
        z-index: 0;
      }

      .wrapper {
        position: relative;
        z-index: 1;
        max-width: 860px;
        margin: 0 auto;
        padding: 2rem 1.5rem 4rem;
      }

      .nav-bar {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 60px;
        padding: 0.5rem;
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        margin-bottom: 2rem;
        flex-wrap: wrap;
      }
      .nav-btn {
        background: transparent;
        border: none;
        color: var(--muted);
        font-family: "Syne", sans-serif;
        font-size: 13px;
        font-weight: 600;
        padding: 10px 24px;
        border-radius: 40px;
        cursor: pointer;
        transition: all 0.2s;
        text-decoration: none;
        display: inline-block;
      }
      .nav-btn.active {
        background: var(--teal);
        color: var(--navy);
      }
      .nav-btn:hover:not(.active) {
        background: rgba(0, 201, 167, 0.15);
        color: var(--teal);
      }

      header {
        text-align: center;
        margin-bottom: 3rem;
      }
      .badge-top {
        display: inline-block;
        font-family: "Syne", sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--teal);
        border: 1px solid var(--teal);
        border-radius: 20px;
        padding: 5px 16px;
        margin-bottom: 1.2rem;
      }
      h1 {
        font-family: "Syne", sans-serif;
        font-size: clamp(2rem, 5vw, 3.2rem);
        font-weight: 800;
        line-height: 1.1;
        margin-bottom: 0.6rem;
      }
      h1 span {
        color: var(--teal);
      }
      .subtitle {
        color: var(--muted);
        font-size: 15px;
        font-weight: 300;
      }

      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        margin-bottom: 2rem;
        flex-wrap: wrap;
      }
      .timer-box {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 40px;
        padding: 8px 20px;
        font-family: "Syne", sans-serif;
        font-weight: 700;
        font-size: 1.2rem;
      }
      .timer-box span {
        color: var(--teal);
      }
      .btn-export {
        background: transparent;
        border: 1px solid var(--gold);
        color: var(--gold);
        border-radius: 40px;
        padding: 8px 20px;
        font-family: "Syne", sans-serif;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
      }
      .btn-export:hover {
        background: var(--gold);
        color: var(--navy);
      }

      .scoreboard {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
        margin-bottom: 2rem;
      }
      .score-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 1rem 1.2rem;
        text-align: center;
      }
      .score-card .label {
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .score-card .val {
        font-family: "Syne", sans-serif;
        font-size: 2rem;
        font-weight: 800;
      }
      .score-card.correct .val {
        color: var(--teal);
      }
      .score-card.wrong .val {
        color: var(--red);
      }
      .score-card.total .val {
        color: var(--gold);
      }

      .section-title {
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: "Syne", sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--teal);
        margin: 2.5rem 0 1rem;
      }
      .section-title::before,
      .section-title::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--teal);
        opacity: 0.25;
      }

      .q-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        margin-bottom: 1.2rem;
        overflow: hidden;
        transition: border-color 0.3s;
      }
      .q-card.answered-correct {
        border-color: rgba(0, 201, 167, 0.4);
      }
      .q-card.answered-wrong {
        border-color: rgba(255, 77, 109, 0.3);
      }

      .q-header {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        padding: 1rem 1.2rem;
        border-bottom: 1px solid var(--border);
      }
      .q-num {
        font-family: "Syne", sans-serif;
        font-size: 11px;
        font-weight: 700;
        color: var(--teal);
        background: var(--teal-dim);
        border-radius: 8px;
        padding: 4px 10px;
        white-space: nowrap;
        margin-top: 2px;
        flex-shrink: 0;
      }
      .q-text {
        font-size: 14px;
        font-weight: 500;
        line-height: 1.5;
        color: var(--white);
      }

      .options {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .opt {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 13px 16px;
        border-top: 1px solid var(--border);
        cursor: pointer;
        transition: background 0.2s;
        font-size: 13.5px;
        color: #b0c0d0;
        user-select: none;
      }
      .opt:nth-child(odd) {
        border-right: 1px solid var(--border);
      }
      .opt:hover {
        background: rgba(255, 255, 255, 0.04);
      }
      .opt.selected {
        background: rgba(0, 201, 167, 0.08);
        color: var(--white);
      }
      .opt.revealed-correct {
        background: var(--teal-dim) !important;
        color: var(--teal) !important;
      }
      .opt.revealed-wrong {
        background: var(--red-dim) !important;
        color: var(--red) !important;
      }
      .opt.dimmed {
        opacity: 0.4;
      }

      .opt-circle {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 1.5px solid rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Syne", sans-serif;
        font-size: 11px;
        font-weight: 700;
        flex-shrink: 0;
        transition: all 0.2s;
      }
      .opt.selected .opt-circle {
        border-color: var(--teal);
        color: var(--teal);
      }
      .opt.revealed-correct .opt-circle {
        background: var(--teal);
        border-color: var(--teal);
        color: var(--navy);
      }
      .opt.revealed-wrong .opt-circle {
        background: var(--red);
        border-color: var(--red);
        color: #fff;
      }

      .q-feedback {
        display: none;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        font-size: 13px;
        font-weight: 500;
        border-top: 1px solid var(--border);
      }
      .q-feedback.show {
        display: flex;
      }
      .q-feedback.ok {
        color: var(--teal);
      }
      .q-feedback.err {
        color: var(--red);
      }
      .q-feedback .icon {
        font-size: 16px;
      }

      .q-footer {
        padding: 10px 16px;
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: flex-end;
      }
      .btn-submit {
        background: var(--teal);
        color: var(--navy);
        border: none;
        border-radius: 10px;
        padding: 8px 22px;
        font-family: "Syne", sans-serif;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        cursor: pointer;
        transition:
          opacity 0.2s,
          transform 0.1s;
      }
      .btn-submit:hover {
        opacity: 0.85;
      }
      .btn-submit:active {
        transform: scale(0.97);
      }
      .btn-submit:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      #final-result {
        display: none;
        background: var(--card);
        border: 1px solid var(--teal);
        border-radius: 20px;
        padding: 2.5rem;
        text-align: center;
        margin-top: 2rem;
      }
      #final-result h2 {
        font-family: "Syne", sans-serif;
        font-size: 2rem;
        font-weight: 800;
        margin-bottom: 0.5rem;
      }
      #final-result p {
        color: var(--muted);
        margin-bottom: 1.5rem;
      }
      .big-score {
        font-family: "Syne", sans-serif;
        font-size: 4rem;
        font-weight: 800;
        color: var(--teal);
        line-height: 1;
      }
      .grade-label {
        font-size: 14px;
        color: var(--gold);
        margin-top: 0.5rem;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      .btn-reset {
        margin-top: 1.5rem;
        background: transparent;
        color: var(--teal);
        border: 1.5px solid var(--teal);
        border-radius: 12px;
        padding: 10px 30px;
        font-family: "Syne", sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 1px;
        cursor: pointer;
        transition:
          background 0.2s,
          color 0.2s;
      }
      .btn-reset:hover {
        background: var(--teal);
        color: var(--navy);
      }

      .progress-bar-wrap {
        height: 4px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 2px;
        margin-bottom: 2rem;
        overflow: hidden;
      }
      .progress-bar-fill {
        height: 100%;
        background: var(--teal);
        border-radius: 2px;
        transition: width 0.4s ease;
        width: 0%;
      }

      @media (max-width: 560px) {
        .options {
          grid-template-columns: 1fr;
        }
        .opt:nth-child(odd) {
          border-right: none;
        }
        .scoreboard {
          grid-template-columns: repeat(3, 1fr);
          gap: 0.5rem;
        }
        .score-card .val {
          font-size: 1.5rem;
        }
        .top-bar {
          flex-direction: column;
          align-items: stretch;
        }
        .timer-box,
        .btn-export {
          text-align: center;
          justify-content: center;
        }
        .nav-bar {
          border-radius: 20px;
        }
        .nav-btn {
          padding: 8px 16px;
          font-size: 11px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="nav-bar">
        <a href="index.html" class="nav-btn">📚 Lecture 1</a>
        <a href="quiz2.html" class="nav-btn active">🖥️ Lecture 2</a>
        <a href="quiz3.html" class="nav-btn">🌐 Lecture 3</a>
      </div>

      <header>
        <div class="badge-top">Lecture 2 · Computer Networks</div>
        <h1>Network <span>Quiz</span></h1>
        <p class="subtitle">
          Part 2: Network Devices & Transmission Media · Select all correct
          answers · then confirm
        </p>
      </header>

      <div class="top-bar">
        <div class="timer-box">⏱️ <span id="timer-display">30:00</span></div>
        <button class="btn-export" id="export-btn">📎 Export Results</button>
      </div>

      <div class="scoreboard">
        <div class="score-card correct">
          <div class="label">Correct</div>
          <div class="val" id="sc-correct">0</div>
        </div>
        <div class="score-card wrong">
          <div class="label">Wrong</div>
          <div class="val" id="sc-wrong">0</div>
        </div>
        <div class="score-card total">
          <div class="label">Score</div>
          <div class="val" id="sc-score">0%</div>
        </div>
      </div>

      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>

      <div id="quiz-container"></div>
      <div id="final-result">
        <h2>Quiz Complete 🎉</h2>
        <p>Here's how you did</p>
        <div class="big-score" id="final-pct">0%</div>
        <div class="grade-label" id="final-grade">—</div>
        <br />
        <button class="btn-reset" id="reset-btn">↺ Try Again</button>
      </div>
    </div>

    <script>
      // ============================================
      // PART 2: Network Devices & Transmission Media - 30 Questions
      // ============================================
      const questions = [
        {
          section: "📡 Network Devices & Transmission Media",
          text: "What is the primary purpose of a Modem?",
          opts: [
            "Connect multiple devices in a network.",
            "Convert digital data from a computer into analog signal.",
            "Protect a network from unauthorized access.",
            "Route data between different networks.",
          ],
          correct: [1],
          rationale:
            "A Modem modulates digital data into analog signals for transmission over telephone or cable lines.",
        },
        {
          section: "📡 Network Devices & Transmission Media",
          text: "Which device operates at Layer 2 of the OSI model and connects devices within the same network?",
          opts: ["Router", "Hub", "Switch", "Gateway"],
          correct: [2],
          rationale:
            "Switches use MAC addresses to forward data to the correct device within a LAN.",
        },
        {
          section: "📡 Network Devices & Transmission Media",
          text: "Why are Hubs largely obsolete today?",
          opts: [
            "They are too expensive.",
            "Due to limitations in terms of collision domains.",
            "They only support wireless.",
            "They cannot connect to the internet.",
          ],
          correct: [1],
          rationale:
            "Hubs broadcast data to all ports, causing frequent data collisions and slowing down the network.",
        },
        {
          section: "📡 Network Devices & Transmission Media",
          text: "Which transmission medium uses light pulses to carry data?",
          opts: [
            "Coaxial Cable",
            "Twisted Pair Cable",
            "Fiber Optic",
            "Radio Waves",
          ],
          correct: [2],
          rationale:
            "Fiber optics use thin strands of glass or plastic to transmit data as pulses of light.",
        },
        {
          section: "📡 Network Devices & Transmission Media",
          text: "What is the main difference between UTP and STP cables?",
          opts: [
            "UTP is faster than STP.",
            "STP has shielding to reduce interference, while UTP does not.",
            "UTP is used for fiber optics.",
            "STP is only for outdoor use.",
          ],
          correct: [1],
          rationale:
            "Shielded Twisted Pair (STP) includes a metallic foil to protect against electromagnetic interference (EMI).",
        },
        {
          section: "📡 Network Devices & Transmission Media",
          text: "Which device regenerates and retransmits signals to extend network distance?",
          opts: ["Switch", "Router", "Repeater", "Bridge"],
          correct: [2],
          rationale:
            "A Repeater receives a signal, regenerates it, and retransmits it to extend the network's physical range.",
        },
        {
          section: "📡 Network Devices & Transmission Media",
          text: "What does a Bridge do in a network?",
          opts: [
            "Connects two different network segments",
            "Blocks all incoming traffic",
            "Converts analog to digital only",
            "Provides wireless access",
          ],
          correct: [0],
          rationale:
            "A Bridge connects and filters traffic between two network segments, reducing collisions.",
        },
        {
          section: "📡 Network Devices & Transmission Media",
          text: "Which cable type is most resistant to electromagnetic interference (EMI)?",
          opts: ["UTP", "Coaxial", "STP", "Fiber Optic"],
          correct: [3],
          rationale:
            "Fiber Optic cables use light signals, making them completely immune to electromagnetic interference.",
        },
        {
          section: "📡 Network Devices & Transmission Media",
          text: "What is the typical maximum length for a Cat5e Ethernet cable?",
          opts: ["50 meters", "100 meters", "200 meters", "500 meters"],
          correct: [1],
          rationale:
            "Cat5e has a maximum recommended length of 100 meters (328 feet) before signal degradation occurs.",
        },
        {
          section: "📡 Network Devices & Transmission Media",
          text: "Which device acts as a 'traffic police' directing data between different networks?",
          opts: ["Switch", "Hub", "Router", "Modem"],
          correct: [2],
          rationale:
            "A Router directs data packets between different networks based on IP addresses.",
        },
        {
          section: "📡 Network Devices & Transmission Media",
          text: "What type of cable uses a BNC connector?",
          opts: ["Twisted Pair", "Fiber Optic", "Coaxial", "USB"],
          correct: [2],
          rationale:
            "Coaxial cables traditionally use BNC (Bayonet Neill-Concelman) connectors.",
        },
        {
          section: "📡 Network Devices & Transmission Media",
          text: "Which wireless technology has the longest range?",
          opts: ["Bluetooth", "Wi-Fi 6", "LoRaWAN", "Zigbee"],
          correct: [2],
          rationale:
            "LoRaWAN can transmit up to 15+ km in rural areas, making it ideal for IoT applications.",
        },
        {
          section: "📡 Network Devices & Transmission Media",
          text: "What is a Firewall primarily used for?",
          opts: [
            "Speed up internet connection",
            "Filter network traffic for security",
            "Connect multiple computers",
            "Store network data",
          ],
          correct: [1],
          rationale:
            "A Firewall monitors and filters incoming/outgoing network traffic based on security rules.",
        },
        {
          section: "📡 Network Devices & Transmission Media",
          text: "Which transmission method sends data in both directions simultaneously?",
          opts: ["Simplex", "Half-Duplex", "Full-Duplex", "Multiplex"],
          correct: [2],
          rationale:
            "Full-Duplex allows simultaneous two-way communication (e.g., telephone calls).",
        },
        {
          section: "📡 Network Devices & Transmission Media",
          text: "What does a Wireless Access Point (WAP) do?",
          opts: [
            "Connects wired devices to wireless network",
            "Blocks wireless signals",
            "Increases internet speed",
            "Acts as a modem",
          ],
          correct: [0],
          rationale:
            "A WAP allows wireless devices to connect to a wired network using Wi-Fi.",
        },
        {
          section: "📡 Network Devices & Transmission Media",
          text: "Which cable category supports speeds up to 10 Gbps at 55 meters?",
          opts: ["Cat5", "Cat5e", "Cat6", "Cat7"],
          correct: [2],
          rationale:
            "Cat6 supports 10 Gbps up to 55 meters; Cat6a extends that to 100 meters.",
        },
        {
          section: "📡 Network Devices & Transmission Media",
          text: "What is the main advantage of Single-Mode Fiber over Multi-Mode Fiber?",
          opts: [
            "Cheaper cost",
            "Longer distance with less dispersion",
            "Easier to install",
            "Thicker cable",
          ],
          correct: [1],
          rationale:
            "Single-Mode Fiber has a smaller core, allowing light to travel longer distances with less signal loss.",
        },
        {
          section: "📡 Network Devices & Transmission Media",
          text: "Which device uses ARP (Address Resolution Protocol)?",
          opts: ["Router", "Switch", "Hub", "Repeater"],
          correct: [1],
          rationale:
            "Switches use ARP to map IP addresses to MAC addresses within a local network.",
        },
        {
          section: "📡 Network Devices & Transmission Media",
          text: "What does PoE (Power over Ethernet) provide?",
          opts: [
            "Faster data transfer",
            "Electrical power through Ethernet cable",
            "Wireless connectivity",
            "Data encryption",
          ],
          correct: [1],
          rationale:
            "PoE delivers both data and electrical power over a single Ethernet cable to devices like IP cameras.",
        },
        {
          section: "📡 Network Devices & Transmission Media",
          text: "Which transmission medium is least affected by physical obstacles?",
          opts: ["Fiber Optic", "Twisted Pair", "Coaxial", "Wireless"],
          correct: [0],
          rationale:
            "Fiber Optic is immune to EMI and physical obstacles that affect wireless signals.",
        },
        {
          section: "📡 Network Devices & Transmission Media",
          text: "What is a VLAN (Virtual Local Area Network)?",
          opts: [
            "Physical network segmentation",
            "Logical grouping of devices on same network",
            "Type of router",
            "Wireless protocol",
          ],
          correct: [1],
          rationale:
            "VLANs logically segment networks without requiring physical separation of devices.",
        },
        {
          section: "📡 Network Devices & Transmission Media",
          text: "Which connector is commonly used for Fiber Optic cables?",
          opts: ["RJ45", "BNC", "LC or SC", "USB-C"],
          correct: [2],
          rationale:
            "LC (Lucent Connector) and SC (Subscriber Connector) are common fiber optic connectors.",
        },
        {
          section: "📡 Network Devices & Transmission Media",
          text: "What does a Network Interface Card (NIC) do?",
          opts: [
            "Connects computer to network",
            "Increases CPU speed",
            "Stores network data",
            "Manages power supply",
          ],
          correct: [0],
          rationale:
            "A NIC provides the physical interface between a computer and the network medium.",
        },
        {
          section: "📡 Network Devices & Transmission Media",
          text: "Which wireless frequency band offers better range but slower speed?",
          opts: ["2.4 GHz", "5 GHz", "6 GHz", "60 GHz"],
          correct: [0],
          rationale:
            "2.4 GHz penetrates obstacles better, providing longer range at the cost of lower speed.",
        },
        {
          section: "📡 Network Devices & Transmission Media",
          text: "What is a Gateway in networking?",
          opts: [
            "Entry/exit point between different networks",
            "Type of firewall",
            "Network cable",
            "Wireless router",
          ],
          correct: [0],
          rationale:
            "A Gateway connects networks with different protocols and translates between them.",
        },
        {
          section: "📡 Network Devices & Transmission Media",
          text: "Which cable uses a foil shield around each pair plus an overall braid?",
          opts: ["UTP", "S/FTP", "F/UTP", "U/FTP"],
          correct: [1],
          rationale:
            "S/FTP (Shielded/Foil Twisted Pair) has individual foil shielding per pair plus an overall braid.",
        },
        {
          section: "📡 Network Devices & Transmission Media",
          text: "What is the function of a Load Balancer?",
          opts: [
            "Distribute network traffic across servers",
            "Block malicious traffic only",
            "Convert IP addresses",
            "Encrypt data",
          ],
          correct: [0],
          rationale:
            "Load Balancers distribute incoming traffic across multiple servers to prevent overload.",
        },
        {
          section: "📡 Network Devices & Transmission Media",
          text: "Which technology uses light to transmit data through air (not cables)?",
          opts: ["Li-Fi", "Wi-Fi", "Bluetooth", "5G"],
          correct: [0],
          rationale:
            "Li-Fi (Light Fidelity) uses visible light communication for data transmission.",
        },
        {
          section: "📡 Network Devices & Transmission Media",
          text: "What does a Proxy Server do?",
          opts: [
            "Acts as intermediary between client and internet",
            "Increases bandwidth",
            "Converts analog to digital",
            "Stores all emails",
          ],
          correct: [0],
          rationale:
            "A Proxy Server forwards client requests, providing anonymity, caching, and content filtering.",
        },
        {
          section: "📡 Network Devices & Transmission Media",
          text: "Which is the correct order of network speed from slowest to fastest?",
          opts: [
            "Coax < Cat5 < Cat6 < Fiber",
            "Fiber < Cat5 < Coax < Cat6",
            "Cat6 < Cat5 < Fiber < Coax",
            "Cat5 < Fiber < Coax < Cat6",
          ],
          correct: [0],
          rationale:
            "Coaxial (10-100 Mbps) < Cat5 (100 Mbps) < Cat6 (1-10 Gbps) < Fiber (10-100+ Gbps).",
        },
      ];

      const labels = ["A", "B", "C", "D"];
      let state = questions.map(() => ({
        selected: new Set(),
        submitted: false,
      }));
      let correctCount = 0,
        wrongCount = 0;
      let timerSeconds = 30 * 60;
      let timerInterval = null;

      function arraysEqual(a, b) {
        const sa = [...a].sort(),
          sb = [...b].sort();
        return sa.length === sb.length && sa.every((v, i) => v === sb[i]);
      }

      function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
          if (state.every((s) => s.submitted)) return;
          if (timerSeconds <= 0) {
            clearInterval(timerInterval);
            alert("Time's up! Auto-submitting all pending questions.");
            for (let i = 0; i < state.length; i++) {
              if (!state[i].submitted) {
                state[i].submitted = true;
                const isRight = arraysEqual(
                  state[i].selected,
                  questions[i].correct,
                );
                if (isRight) correctCount++;
                else wrongCount++;
              }
            }
            updateScore();
            render();
            checkFinished();
          } else {
            timerSeconds--;
            updateTimerDisplay();
          }
        }, 1000);
      }

      function updateTimerDisplay() {
        const mins = Math.floor(timerSeconds / 60);
        const secs = timerSeconds % 60;
        document.getElementById("timer-display").textContent =
          `${mins.toString().padStart(2, "0")}:${secs.toString().padStart(2, "0")}`;
      }

      function exportResults() {
        const totalAnswered = state.filter((s) => s.submitted).length;
        const percentage =
          totalAnswered === 0
            ? 0
            : Math.round((correctCount / totalAnswered) * 100);
        const finalGrade =
          percentage >= 90
            ? "Excellent"
            : percentage >= 75
              ? "Very Good"
              : percentage >= 60
                ? "Good"
                : "Keep Studying";
        const results = {
          timestamp: new Date().toISOString(),
          quiz: "Part 2: Devices & Media",
          totalQuestions: questions.length,
          answered: totalAnswered,
          correct: correctCount,
          wrong: wrongCount,
          percentage: percentage,
          grade: finalGrade,
          details: questions.map((q, i) => ({
            question: q.text,
            userAnswers: [...state[i].selected].map(
              (idx) => labels[idx] + ": " + q.opts[idx],
            ),
            correctAnswers: q.correct.map(
              (idx) => labels[idx] + ": " + q.opts[idx],
            ),
            isCorrect: state[i].submitted
              ? arraysEqual(state[i].selected, q.correct)
              : null,
            rationale: q.rationale,
          })),
        };
        const dataStr = JSON.stringify(results, null, 2);
        const blob = new Blob([dataStr], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `quiz_results_part2_${new Date().toISOString().slice(0, 19)}.json`;
        a.click();
        URL.revokeObjectURL(url);
      }

      function updateScore() {
        const done = state.filter((s) => s.submitted).length;
        document.getElementById("sc-correct").textContent = correctCount;
        document.getElementById("sc-wrong").textContent = wrongCount;
        const pct = done === 0 ? 0 : Math.round((correctCount / done) * 100);
        document.getElementById("sc-score").textContent = pct + "%";
        document.getElementById("progress-bar").style.width =
          Math.round((done / questions.length) * 100) + "%";
      }

      function render() {
        const container = document.getElementById("quiz-container");
        container.innerHTML = "";
        let lastSection = null;

        questions.forEach((q, qi) => {
          if (q.section && q.section !== lastSection) {
            lastSection = q.section;
            const sec = document.createElement("div");
            sec.className = "section-title";
            sec.textContent = q.section;
            container.appendChild(sec);
          }

          const s = state[qi];
          const card = document.createElement("div");
          card.className =
            "q-card" +
            (s.submitted
              ? arraysEqual(s.selected, q.correct)
                ? " answered-correct"
                : " answered-wrong"
              : "");
          card.id = "card-" + qi;

          const header = document.createElement("div");
          header.className = "q-header";
          header.innerHTML = `<span class="q-num">Q${qi + 1}</span><span class="q-text">${q.text}</span>`;
          card.appendChild(header);

          const optsDiv = document.createElement("div");
          optsDiv.className = "options";

          q.opts.forEach((o, oi) => {
            const div = document.createElement("div");
            let cls = "opt";
            if (s.submitted) {
              const isCorrect = q.correct.includes(oi);
              const isSelected = s.selected.has(oi);
              if (isCorrect) cls += " revealed-correct";
              else if (isSelected && !isCorrect) cls += " revealed-wrong";
              else cls += " dimmed";
            } else if (s.selected.has(oi)) {
              cls += " selected";
            }
            div.className = cls;
            div.setAttribute("role", "button");
            div.setAttribute("tabindex", "0");
            div.setAttribute("aria-label", `Option ${labels[oi]}: ${o}`);
            div.innerHTML = `<div class="opt-circle">${labels[oi]}</div> ${o}`;
            if (!s.submitted) {
              div.addEventListener("click", () => toggleOpt(qi, oi));
              div.addEventListener("keypress", (e) => {
                if (e.key === "Enter" || e.key === " ") {
                  e.preventDefault();
                  toggleOpt(qi, oi);
                }
              });
            }
            optsDiv.appendChild(div);
          });
          card.appendChild(optsDiv);

          if (s.submitted) {
            const fb = document.createElement("div");
            const isRight = arraysEqual(s.selected, q.correct);
            fb.className = "q-feedback show " + (isRight ? "ok" : "err");
            fb.innerHTML = isRight
              ? `<span class="icon">✓</span> Correct! Well done.`
              : `<span class="icon">✗</span> Incorrect — ${q.rationale || "The highlighted options are the correct answers."}`;
            card.appendChild(fb);
          }

          if (!s.submitted) {
            const footer = document.createElement("div");
            footer.className = "q-footer";
            const btn = document.createElement("button");
            btn.className = "btn-submit";
            btn.textContent = "Confirm";
            btn.disabled = s.selected.size === 0;
            btn.addEventListener("click", () => submitQ(qi));
            footer.appendChild(btn);
            card.appendChild(footer);
          }

          container.appendChild(card);
        });
      }

      function toggleOpt(qi, oi) {
        if (state[qi].submitted) return;
        if (state[qi].selected.has(oi)) state[qi].selected.delete(oi);
        else state[qi].selected.add(oi);

        const card = document.getElementById(`card-${qi}`);
        if (card) {
          const optDivs = card.querySelectorAll(".opt");
          if (optDivs[oi]) {
            if (state[qi].selected.has(oi))
              optDivs[oi].classList.add("selected");
            else optDivs[oi].classList.remove("selected");
          }
          const submitBtn = card.querySelector(".btn-submit");
          if (submitBtn) submitBtn.disabled = state[qi].selected.size === 0;
        }
      }

      function submitQ(qi) {
        if (state[qi].submitted) return;
        state[qi].submitted = true;
        const isRight = arraysEqual(state[qi].selected, questions[qi].correct);
        if (isRight) correctCount++;
        else wrongCount++;
        updateScore();
        renderCard(qi);
        checkFinished();
      }

      function renderCard(qi) {
        const old = document.getElementById("card-" + qi);
        if (!old) return;
        const temp = document.createElement("div");
        document.getElementById("quiz-container").insertBefore(temp, old);
        old.remove();

        const q = questions[qi];
        const s = state[qi];
        const card = document.createElement("div");
        card.className =
          "q-card" +
          (s.submitted
            ? arraysEqual(s.selected, q.correct)
              ? " answered-correct"
              : " answered-wrong"
            : "");
        card.id = "card-" + qi;

        const header = document.createElement("div");
        header.className = "q-header";
        header.innerHTML = `<span class="q-num">Q${qi + 1}</span><span class="q-text">${q.text}</span>`;
        card.appendChild(header);

        const optsDiv = document.createElement("div");
        optsDiv.className = "options";
        q.opts.forEach((o, oi) => {
          const div = document.createElement("div");
          let cls = "opt";
          if (s.submitted) {
            const isCorrect = q.correct.includes(oi);
            const isSelected = s.selected.has(oi);
            if (isCorrect) cls += " revealed-correct";
            else if (isSelected && !isCorrect) cls += " revealed-wrong";
            else cls += " dimmed";
          } else if (s.selected.has(oi)) {
            cls += " selected";
          }
          div.className = cls;
          div.setAttribute("role", "button");
          div.setAttribute("tabindex", "0");
          div.setAttribute("aria-label", `Option ${labels[oi]}: ${o}`);
          div.innerHTML = `<div class="opt-circle">${labels[oi]}</div> ${o}`;
          if (!s.submitted) {
            div.addEventListener("click", () => toggleOpt(qi, oi));
            div.addEventListener("keypress", (e) => {
              if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                toggleOpt(qi, oi);
              }
            });
          }
          optsDiv.appendChild(div);
        });
        card.appendChild(optsDiv);

        if (s.submitted) {
          const fb = document.createElement("div");
          const isRight = arraysEqual(s.selected, q.correct);
          fb.className = "q-feedback show " + (isRight ? "ok" : "err");
          fb.innerHTML = isRight
            ? `<span class="icon">✓</span> Correct! Well done.`
            : `<span class="icon">✗</span> Incorrect — ${q.rationale || "The highlighted options are the correct answers."}`;
          card.appendChild(fb);
        }

        if (!s.submitted) {
          const footer = document.createElement("div");
          footer.className = "q-footer";
          const btn = document.createElement("button");
          btn.className = "btn-submit";
          btn.textContent = "Confirm";
          btn.disabled = s.selected.size === 0;
          btn.addEventListener("click", () => submitQ(qi));
          footer.appendChild(btn);
          card.appendChild(footer);
        }

        temp.replaceWith(card);
      }

      function checkFinished() {
        if (state.every((s) => s.submitted)) {
          if (timerInterval) clearInterval(timerInterval);
          const pct = Math.round((correctCount / questions.length) * 100);
          document.getElementById("final-pct").textContent = pct + "%";
          let grade =
            pct >= 90
              ? "Excellent 🏆"
              : pct >= 75
                ? "Very Good ✨"
                : pct >= 60
                  ? "Good 👍"
                  : "Keep Studying 📚";
          document.getElementById("final-grade").textContent = grade;
          document.getElementById("final-result").style.display = "block";
          document
            .getElementById("final-result")
            .scrollIntoView({ behavior: "smooth" });
        }
      }

      function resetQuiz() {
        if (timerInterval) clearInterval(timerInterval);
        state = questions.map(() => ({
          selected: new Set(),
          submitted: false,
        }));
        correctCount = 0;
        wrongCount = 0;
        timerSeconds = 30 * 60;
        updateTimerDisplay();
        document.getElementById("final-result").style.display = "none";
        updateScore();
        render();
        startTimer();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      render();
      updateScore();
      updateTimerDisplay();
      startTimer();

      document
        .getElementById("export-btn")
        .addEventListener("click", exportResults);
      document.getElementById("reset-btn").addEventListener("click", resetQuiz);
    </script>
  </body>
</html>
