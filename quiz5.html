<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Computer Networks Quiz - Part 1</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --navy: #0d1b2a;
    --navy2: #1b2d42;
    --teal: #00c9a7;
    --teal-dim: rgba(0,201,167,0.12);
    --red: #ff4d6d;
    --red-dim: rgba(255,77,109,0.12);
    --gold: #f5a623;
    --white: #f0f4f8;
    --muted: #8899aa;
    --card: #162032;
    --border: rgba(255,255,255,0.07);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--navy);
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,201,167,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,201,167,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .wrapper { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

  /* Navigation Bar */
  .nav-bar {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 60px;
    padding: 0.5rem;
    display: flex;
    justify-content: center;
    gap: 0.5rem;
    margin-bottom: 2rem;
    flex-wrap: wrap;
  }
  .nav-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 24px;
    border-radius: 40px;
    cursor: pointer;
    transition: all 0.2s;
    text-decoration: none;
    display: inline-block;
  }
  .nav-btn.active {
    background: var(--teal);
    color: var(--navy);
  }
  .nav-btn:hover:not(.active) {
    background: rgba(0,201,167,0.15);
    color: var(--teal);
  }

  header { text-align: center; margin-bottom: 3rem; }
  .badge-top {
    display: inline-block;
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--teal);
    border: 1px solid var(--teal);
    border-radius: 20px;
    padding: 5px 16px;
    margin-bottom: 1.2rem;
  }
  h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: .6rem;
  }
  h1 span { color: var(--teal); }
  .subtitle { color: var(--muted); font-size: 15px; font-weight: 300; }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    margin-bottom: 2rem;
    flex-wrap: wrap;
  }
  .timer-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 40px;
    padding: 8px 20px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 1.2rem;
  }
  .timer-box span { color: var(--teal); }
  .btn-export {
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold);
    border-radius: 40px;
    padding: 8px 20px;
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
  }
  .btn-export:hover { background: var(--gold); color: var(--navy); }

  .scoreboard {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem;
    margin-bottom: 2rem;
  }
  .score-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1rem 1.2rem;
    text-align: center;
  }
  .score-card .label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .score-card .val { font-family: 'Syne', sans-serif; font-size: 2rem; font-weight: 800; }
  .score-card.correct .val { color: var(--teal); }
  .score-card.wrong  .val { color: var(--red); }
  .score-card.total  .val { color: var(--gold); }

  .section-title {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--teal);
    margin: 2.5rem 0 1rem;
  }
  .section-title::before, .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--teal);
    opacity: .25;
  }

  .q-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    margin-bottom: 1.2rem;
    overflow: hidden;
    transition: border-color .3s;
  }
  .q-card.answered-correct { border-color: rgba(0,201,167,.4); }
  .q-card.answered-wrong   { border-color: rgba(255,77,109,.3); }

  .q-header {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 1rem 1.2rem;
    border-bottom: 1px solid var(--border);
  }
  .q-num {
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: var(--teal);
    background: var(--teal-dim);
    border-radius: 8px;
    padding: 4px 10px;
    white-space: nowrap;
    margin-top: 2px;
    flex-shrink: 0;
  }
  .q-text { font-size: 14px; font-weight: 500; line-height: 1.5; color: var(--white); }

  .options { display: grid; grid-template-columns: 1fr 1fr; }
  .opt {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 16px;
    border-top: 1px solid var(--border);
    cursor: pointer;
    transition: background .2s;
    font-size: 13.5px;
    color: #b0c0d0;
    user-select: none;
  }
  .opt:nth-child(odd)  { border-right: 1px solid var(--border); }
  .opt:hover { background: rgba(255,255,255,0.04); }
  .opt.selected { background: rgba(0,201,167,0.08); color: var(--white); }
  .opt.revealed-correct { background: var(--teal-dim) !important; color: var(--teal) !important; }
  .opt.revealed-wrong   { background: var(--red-dim)  !important; color: var(--red)  !important; }
  .opt.dimmed { opacity: .4; }

  .opt-circle {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,.2);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
    transition: all .2s;
  }
  .opt.selected          .opt-circle { border-color: var(--teal); color: var(--teal); }
  .opt.revealed-correct  .opt-circle { background: var(--teal); border-color: var(--teal); color: var(--navy); }
  .opt.revealed-wrong    .opt-circle { background: var(--red);  border-color: var(--red);  color: #fff; }

  .q-feedback {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 500;
    border-top: 1px solid var(--border);
  }
  .q-feedback.show { display: flex; }
  .q-feedback.ok  { color: var(--teal); }
  .q-feedback.err { color: var(--red);  }
  .q-feedback .icon { font-size: 16px; }

  .q-footer { padding: 10px 16px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; }
  .btn-submit {
    background: var(--teal);
    color: var(--navy);
    border: none;
    border-radius: 10px;
    padding: 8px 22px;
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity .2s, transform .1s;
  }
  .btn-submit:hover { opacity: .85; }
  .btn-submit:active { transform: scale(.97); }
  .btn-submit:disabled { opacity: .3; cursor: not-allowed; }

  #final-result {
    display: none;
    background: var(--card);
    border: 1px solid var(--teal);
    border-radius: 20px;
    padding: 2.5rem;
    text-align: center;
    margin-top: 2rem;
  }
  #final-result h2 { font-family: 'Syne', sans-serif; font-size: 2rem; font-weight: 800; margin-bottom: .5rem; }
  #final-result p  { color: var(--muted); margin-bottom: 1.5rem; }
  .big-score { font-family: 'Syne', sans-serif; font-size: 4rem; font-weight: 800; color: var(--teal); line-height: 1; }
  .grade-label { font-size: 14px; color: var(--gold); margin-top: .5rem; letter-spacing: 2px; text-transform: uppercase; }

  .btn-reset {
    margin-top: 1.5rem;
    background: transparent;
    color: var(--teal);
    border: 1.5px solid var(--teal);
    border-radius: 12px;
    padding: 10px 30px;
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: background .2s, color .2s;
  }
  .btn-reset:hover { background: var(--teal); color: var(--navy); }

  .progress-bar-wrap { height: 4px; background: rgba(255,255,255,.06); border-radius: 2px; margin-bottom: 2rem; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: var(--teal); border-radius: 2px; transition: width .4s ease; width: 0%; }

  @media (max-width: 560px) {
    .options { grid-template-columns: 1fr; }
    .opt:nth-child(odd) { border-right: none; }
    .scoreboard { grid-template-columns: repeat(3,1fr); gap: .5rem; }
    .score-card .val { font-size: 1.5rem; }
    .top-bar { flex-direction: column; align-items: stretch; }
    .timer-box, .btn-export { text-align: center; justify-content: center; }
    .nav-bar { border-radius: 20px; }
    .nav-btn { padding: 8px 16px; font-size: 11px; }
  }
</style>
</head>
<body>
<div class="wrapper">

  <!-- Navigation Bar -->
  <div class="nav-bar">
    <a href="index.html" class="nav-btn ">📚 Lecture 1</a>
    <a href="quiz2.html" class="nav-btn">🖥️ Lecture 2</a>
    <a href="quiz3.html" class="nav-btn">🌐 Lecture 3</a>
    <a href="quiz4.html" class="nav-btn ">💡Lecture 4</a>
    <a href="quiz5.html" class="nav-btn active ">🛜Lecture 5</a>
  </div>

  <header>
    <div class="badge-top">Lecture 1 · Computer Networks</div>
    <h1>Network <span>Quiz</span></h1>
    <p class="subtitle">Lecture 1 · Select all correct answers · then confirm</p>
  </header>

  <div class="top-bar">
    <div class="timer-box">⏱️ <span id="timer-display">30:00</span></div>
    <button class="btn-export" id="export-btn">📎 Export Results</button>
  </div>

  <div class="scoreboard">
    <div class="score-card correct"><div class="label">Correct</div><div class="val" id="sc-correct">0</div></div>
    <div class="score-card wrong" ><div class="label">Wrong</div>  <div class="val" id="sc-wrong">0</div></div>
    <div class="score-card total" ><div class="label">Score</div>  <div class="val" id="sc-score">0%</div></div>
  </div>

  <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progress-bar"></div></div>

  <div id="quiz-container"></div>
  <div id="final-result">
    <h2>Quiz Complete 🎉</h2>
    <p>Here's how you did</p>
    <div class="big-score" id="final-pct">0%</div>
    <div class="grade-label" id="final-grade">—</div>
    <br/>
    <button class="btn-reset" id="reset-btn">↺ Try Again</button>
  </div>

</div>

<script>
// ============================================
// Lecture 1 - 32 Questions
// ============================================
const questions = [
  {
    section: "📡 Digital-to-Digital Encoding",
    text: "What is the definition of 'Digital-to-digital encoding' according to the file?",
    opts: [
      "Representing digital information by a digital signal.",
      "Translating binary 1s and 0s into a sequence of voltage pulses.",
      "Converting analog signals into digital pulses.",
      "Propagating voltage pulses over a wire.",
    ],
    correct: [0, 1, 3],
    rationale:
      "Digital-to-digital encoding represents digital info with a digital signal by translating bits into voltage pulses and propagating them over a wire. Converting analog to digital is a different process (analog-to-digital conversion).",
  },
  {
    section: "📡 Digital-to-Digital Encoding",
    text: "In 'Unipolar Encoding', how are binary bits represented?",
    opts: [
      "1s are represented as a positive value.",
      "0s are represented as a negative value.",
      "0s are represented as a zero value.",
      "Pulse polarity determines if it's positive or negative.",
    ],
    correct: [0, 2, 3],
    rationale:
      "In Unipolar encoding, binary 1 is a positive voltage, binary 0 is zero voltage, and pulse polarity (positive vs zero) distinguishes the bits. 0 is not represented as a negative value.",
  },
  {
    section: "📡 Digital-to-Digital Encoding",
    text: "What are the advantages of 'Polar Encoding' over Unipolar?",
    opts: [
      "It uses two voltage levels (one positive, one negative).",
      "It reduces the average voltage level.",
      "It alleviates the DC component problem.",
      "It uses zero voltage for binary 0.",
    ],
    correct: [0, 1, 2],
    rationale:
      "Polar encoding uses positive and negative voltages, reducing average voltage and alleviating the DC component issue. Using zero voltage for binary 0 is characteristic of Unipolar, not an advantage of Polar.",
  },
  {
    section: "📡 Digital-to-Digital Encoding",
    text: "Which statements describe 'Bipolar Encoding' correctly?",
    opts: [
      "It uses three voltage levels: positive, negative, and zero.",
      "Zero level represents binary 0.",
      "Binary 1 is represented by constant positive voltage.",
      "Binary 1 is represented by alternating positive and negative voltages.",
    ],
    correct: [0, 1, 3],
    rationale:
      "Bipolar encoding uses three levels (+/0/-), with zero representing binary 0. Binary 1 alternates between positive and negative voltages, not a constant positive voltage.",
  },
  {
    section: "📡 Digital-to-Digital Encoding",
    text: "Analyze the NRZ (Non-Return to Zero) schemes mentioned:",
    opts: [
      "In NRZ-L, the signal level depends on the bit type (e.g., 0 is positive, 1 is negative).",
      "In NRZ-I, an inversion of voltage occurs to represent a 1 bit.",
      "In NRZ-I, a transition occurs between positive and negative for 1 bit.",
      "Both NRZ-L and NRZ-I are types of Bipolar encoding.",
    ],
    correct: [0, 1, 2],
    rationale:
      "NRZ-L uses level based on bit type; NRZ-I uses voltage inversion (transition) for binary 1. NRZ schemes are Polar encoding, not Bipolar (which uses three levels).",
  },
  {
    section: "📡 Digital-to-Digital Encoding",
    text: "What makes 'RZ (Return to Zero)' encoding unique?",
    opts: [
      "The signal returns to zero between each bit interval.",
      "It uses three voltage levels (positive, negative, zero).",
      "It ensures better clock recovery at the receiver end.",
      "Transitions occur at the midpoint of each bit interval.",
    ],
    correct: [0, 1, 2, 3],
    rationale:
      "RZ returns to zero between bits, uses three levels (+, -, 0), enables better clock recovery, and has transitions at the bit interval midpoint. All options are correct.",
  },
  {
    section: "📡 Digital-to-Digital Encoding",
    text: "Regarding Biphase encoding (Manchester & Differential Manchester):",
    opts: [
      "Manchester combines NRZ-L and RZ schemes.",
      "Every symbol in Manchester has a level transition in the middle.",
      "Differential Manchester combines NRZ-I and RZ.",
      "In Differential Manchester, the level at the beginning of the symbol is determined by the symbol value.",
    ],
    correct: [0, 1, 2, 3],
    rationale:
      "Manchester = NRZ-L + RZ (mid-bit transition). Differential Manchester = NRZ-I + RZ, where the start level depends on the bit value. All options are correct.",
  },
  {
    section: "🛡️ Error Detection and Correction",
    text: "How is an 'Error' defined in data transmission?",
    opts: [
      "When the message received is not identical to the message transmitted.",
      "When a 0 bit is changed to 1 or vice-versa.",
      "When the system guarantees identical data delivery.",
      "A situation where bits are modified during transmission.",
    ],
    correct: [0, 1, 3],
    rationale:
      "An error occurs when received ≠ transmitted, typically due to bit flips (0→1 or 1→0). Guaranteed identical delivery is the opposite (error-free transmission).",
  },
  {
    section: "🛡️ Error Detection and Correction",
    text: "Differentiate between Single-Bit and Burst Errors:",
    opts: [
      "Single-Bit Error: Only one bit of a data unit is changed.",
      "Burst Error: Two or more bits are changed from 0 to 1 or 1 to 0.",
      "Burst Error: The length is measured from the first corrupted bit to the last.",
      "Single-bit errors are always 5 bits long.",
    ],
    correct: [0, 1, 2],
    rationale:
      "Single-bit affects one bit; burst affects two or more bits, with length measured from first to last corrupted bit. Single-bit errors are not fixed to any length like 5 bits.",
  },
  {
    section: "🛡️ Error Detection and Correction",
    text: "Which of the following are 'Error Detecting Techniques' listed in the file?",
    opts: [
      "Single parity check.",
      "Two-dimensional parity check.",
      "Checksum.",
      "Cyclic redundancy check (CRC).",
    ],
    correct: [0, 1, 2, 3],
    rationale:
      "All four methods (Single parity, 2D parity, Checksum, CRC) are standard error-detecting techniques mentioned in the file.",
  },
  {
    section: "🛡️ Error Detection and Correction",
    text: "In 'Single Parity Check', what happens at the receiving end?",
    opts: [
      "The parity bit is recalculated from the received data bits.",
      "It is compared with the received parity bit.",
      "Data is rejected if the parity doesn't match the expected even total of 1s.",
      "It is an expensive way to detect errors.",
    ],
    correct: [0, 1, 2],
    rationale:
      "Receiver recalculates parity, compares to received parity bit, and rejects data on mismatch. Single parity is inexpensive (low overhead), not expensive.",
  },
  {
    section: "🛡️ Error Detection and Correction",
    text: "What are the characteristics of a 'Checksum'?",
    opts: [
      "It is based on the concept of redundancy.",
      "The sender calculates a sum and its complement.",
      "The receiver keeps the data if the final result is zero.",
      "It organizes data in the form of a table.",
    ],
    correct: [0, 1, 2],
    rationale:
      "Checksum uses redundancy: sender computes sum and complement; receiver checks if final result is zero. Organizing data in a table describes 2D parity, not checksum.",
  },
  {
    section: "🛡️ Error Detection and Correction",
    text: "Regarding 'CRC (Cyclic Redundancy Check)':",
    opts: [
      "It uses a divisor to generate a remainder.",
      "Extra 0's added to data are 'one less than the number of bits in the divisor'.",
      "XOR operation is used during the process.",
      "The remainder is appended to the Data Packet.",
    ],
    correct: [0, 1, 2, 3],
    rationale:
      "CRC uses binary division with a divisor, appends (divisor length - 1) zeros, uses XOR operations, and appends the remainder to the packet. All options are correct.",
  },
  {
    section: "🛡️ Error Detection and Correction",
    text: "How is 'Error Correction' handled according to the text?",
    opts: [
      "Backward error correction.",
      "Forward error correction.",
      "Hamming Code is a technique used for error correction.",
      "Only the sender can correct errors.",
    ],
    correct: [0, 1, 2],
    rationale:
      "Error correction is done via backward (retransmission) or forward (receiver corrects) methods; Hamming Code is a forward error correction technique. Receivers can also correct errors.",
  },
  {
    section: "🛡️ Error Detection and Correction",
    text: "In 'Hamming Code', how is the error position determined?",
    opts: [
      "By recalculating parity bits at the receiving end.",
      "The decimal value of the recalculated parity bits indicates the error position.",
      "Redundant bits 'r' are placed in positions like 1, 2, 4, 8... (2^(k-1)).",
      "It uses the formula 2^r ≥ d + r + 1.",
    ],
    correct: [0, 1, 2, 3],
    rationale:
      "Hamming Code recalculates parity bits at receiver; the decimal value of these bits gives error position. Redundant bits go at power-of-2 positions (1,2,4,8...), and the formula ensures error correction capability. All options are correct.",
  },
  {
    section: "🔗 ARP and Routing Algorithms",
    text: "What is the primary purpose of 'ARP (Address Resolution Protocol)'?",
    opts: [
      "To associate an IP address with a MAC address.",
      "To identify the actual device using a MAC address.",
      "To locate a device on the network using an IP address.",
      "To change the MAC address imprinted on the NIC.",
    ],
    correct: [0, 1, 2],
    rationale:
      "ARP maps IP addresses to MAC addresses, helping locate devices on a network. ARP does not change the factory-imprinted MAC address on a NIC.",
  },
  {
    section: "🔗 ARP and Routing Algorithms",
    text: "Describe the 'ARP process' when the ARP cache is empty:",
    opts: [
      "The device broadcasts a message to the entire network.",
      "Each device is asked for a matching MAC address.",
      "The matching device responds back with its MAC address.",
      "The received MAC address is then stored in the ARP cache.",
    ],
    correct: [0, 1, 2, 3],
    rationale:
      "ARP broadcasts a request; all devices check; the matching device replies with its MAC; the sender stores it in ARP cache. All options describe the correct process.",
  },
  {
    section: "🔗 ARP and Routing Algorithms",
    text: "What is the difference between 'Dynamic' and 'Static' ARP entries?",
    opts: [
      "Dynamic entries are created automatically.",
      "Dynamic entries are permanent.",
      "Static entries are entered manually using a command utility.",
      "Dynamic entries are removed periodically.",
    ],
    correct: [0, 2, 3],
    rationale:
      "Dynamic entries are auto-created and temporary (periodically removed). Static entries are manually added and permanent. Dynamic entries are not permanent.",
  },
  {
    section: "🔗 ARP and Routing Algorithms",
    text: "According to the 'Routing Algorithm' section:",
    opts: [
      "Routing is the process of forwarding packets from source to destination.",
      "The 'best path' is defined as the 'least-cost path'.",
      "Routing algorithms determine the best route.",
      "Algorithms are divided into Adaptive and Non-adaptive.",
    ],
    correct: [0, 1, 2, 3],
    rationale:
      "Routing forwards packets; best path = least-cost; algorithms find best routes and are classified as adaptive or non-adaptive. All options are correct.",
  },
  {
    section: "🔗 ARP and Routing Algorithms",
    text: "What defines 'Distance Vector Routing'?",
    opts: [
      "Routers use a distributed algorithm to compute routing tables.",
      "Each router maintains a distance table known as a 'Vector'.",
      "It is asynchronous and doesn't require all nodes to operate in lock step.",
      "The process is iterative until no more information is exchanged.",
    ],
    correct: [0, 1, 2, 3],
    rationale:
      "Distance Vector uses distributed computation, maintains a distance vector table, is asynchronous, and iteratively exchanges info until convergence. All options are correct.",
  },
  {
    section: "🔗 ARP and Routing Algorithms",
    text: "What defines 'Link-State Routing'?",
    opts: [
      "Routers exchange messages to learn the entire network topology.",
      "It uses the 'shortest path computation' for the routing table.",
      "Each router shares knowledge of its neighborhood with all other routers.",
      "It is the second family of routing protocols.",
    ],
    correct: [0, 1, 2, 3],
    rationale:
      "Link-State routers learn full topology via flooding, compute shortest paths (Dijkstra), share neighborhood info with all, and represent the second major routing family. All options are correct.",
  },
  {
    section: "🔗 ARP and Routing Algorithms",
    text: "Compare Distance Vector (DV) vs. Link State (LS) based on the table:",
    opts: [
      "DV convergence is slow, while LS is fast.",
      "DV configuration is easy, while LS is difficult.",
      "DV knows the entire topology, but LS does not.",
      "DV uses the Bellman-Ford (Bredford) algorithm; LS uses Dijkstra.",
    ],
    correct: [0, 1, 3],
    rationale:
      "DV: slow convergence, easy config, Bellman-Ford algorithm. LS: fast convergence, harder config, Dijkstra's algorithm. LS knows full topology; DV only knows neighbors' distances.",
  },
  {
    section: "🔗 ARP and Routing Algorithms",
    text: "Which metrics are used by routing protocols to determine the best path?",
    opts: ["Hop count.", "Delay.", "Bandwidth.", "Cost."],
    correct: [0, 1, 2, 3],
    rationale:
      "Routing protocols commonly use hop count, delay, bandwidth, and cost (or composite metrics) to determine the best path. All options are valid metrics.",
  },
];


const labels = ['A','B','C','D'];
let state = questions.map(() => ({ selected: new Set(), submitted: false }));
let correctCount = 0, wrongCount = 0;
let timerSeconds = 30 * 60;
let timerInterval = null;

function arraysEqual(a, b) {
  const sa = [...a].sort(), sb = [...b].sort();
  return sa.length === sb.length && sa.every((v,i) => v === sb[i]);
}

function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (state.every(s => s.submitted)) return;
    if (timerSeconds <= 0) {
      clearInterval(timerInterval);
      alert("Time's up! Auto-submitting all pending questions.");
      for (let i = 0; i < state.length; i++) {
        if (!state[i].submitted) {
          state[i].submitted = true;
          const isRight = arraysEqual(state[i].selected, questions[i].correct);
          if (isRight) correctCount++; else wrongCount++;
        }
      }
      updateScore();
      render();
      checkFinished();
    } else {
      timerSeconds--;
      updateTimerDisplay();
    }
  }, 1000);
}

function updateTimerDisplay() {
  const mins = Math.floor(timerSeconds / 60);
  const secs = timerSeconds % 60;
  document.getElementById('timer-display').textContent = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
}

function exportResults() {
  const totalAnswered = state.filter(s => s.submitted).length;
  const percentage = totalAnswered === 0 ? 0 : Math.round((correctCount / totalAnswered) * 100);
  const finalGrade = percentage >= 90 ? 'Excellent' : percentage >= 75 ? 'Very Good' : percentage >= 60 ? 'Good' : 'Keep Studying';
  const results = {
    timestamp: new Date().toISOString(),
    quiz: "Lecture 1",
    totalQuestions: questions.length,
    answered: totalAnswered,
    correct: correctCount,
    wrong: wrongCount,
    percentage: percentage,
    grade: finalGrade,
    details: questions.map((q, i) => ({
      question: q.text,
      userAnswers: [...state[i].selected].map(idx => labels[idx] + ': ' + q.opts[idx]),
      correctAnswers: q.correct.map(idx => labels[idx] + ': ' + q.opts[idx]),
      isCorrect: state[i].submitted ? arraysEqual(state[i].selected, q.correct) : null
    }))
  };
  const dataStr = JSON.stringify(results, null, 2);
  const blob = new Blob([dataStr], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `quiz_results_part1_${new Date().toISOString().slice(0,19)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function updateScore() {
  const done = state.filter(s => s.submitted).length;
  document.getElementById('sc-correct').textContent = correctCount;
  document.getElementById('sc-wrong').textContent   = wrongCount;
  const pct = done === 0 ? 0 : Math.round((correctCount / done) * 100);
  document.getElementById('sc-score').textContent = pct + '%';
  document.getElementById('progress-bar').style.width = Math.round((done / questions.length) * 100) + '%';
}

function render() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';
  let lastSection = null;

  questions.forEach((q, qi) => {
    if (q.section && q.section !== lastSection) {
      lastSection = q.section;
      const sec = document.createElement('div');
      sec.className = 'section-title';
      sec.textContent = q.section;
      container.appendChild(sec);
    }

    const s = state[qi];
    const card = document.createElement('div');
    card.className = 'q-card' + (s.submitted ? (arraysEqual(s.selected, q.correct) ? ' answered-correct' : ' answered-wrong') : '');
    card.id = 'card-' + qi;

    const header = document.createElement('div');
    header.className = 'q-header';
    header.innerHTML = `<span class="q-num">Q${qi+1}</span><span class="q-text">${q.text}</span>`;
    card.appendChild(header);

    const optsDiv = document.createElement('div');
    optsDiv.className = 'options';

    q.opts.forEach((o, oi) => {
      const div = document.createElement('div');
      let cls = 'opt';
      if (s.submitted) {
        const isCorrect = q.correct.includes(oi);
        const isSelected = s.selected.has(oi);
        if (isCorrect) cls += ' revealed-correct';
        else if (isSelected && !isCorrect) cls += ' revealed-wrong';
        else cls += ' dimmed';
      } else if (s.selected.has(oi)) {
        cls += ' selected';
      }
      div.className = cls;
      div.setAttribute('role', 'button');
      div.setAttribute('tabindex', '0');
      div.setAttribute('aria-label', `Option ${labels[oi]}: ${o}`);
      div.innerHTML = `<div class="opt-circle">${labels[oi]}</div> ${o}`;
      if (!s.submitted) {
        div.addEventListener('click', () => toggleOpt(qi, oi));
        div.addEventListener('keypress', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleOpt(qi, oi); } });
      }
      optsDiv.appendChild(div);
    });
    card.appendChild(optsDiv);

    if (s.submitted) {
      const fb = document.createElement('div');
      const isRight = arraysEqual(s.selected, q.correct);
      fb.className = 'q-feedback show ' + (isRight ? 'ok' : 'err');
      fb.innerHTML = isRight
        ? `<span class="icon">✓</span> Correct! Well done.`
        : `<span class="icon">✗</span> Incorrect — The highlighted options are the correct answers.`;
      card.appendChild(fb);
    }

    if (!s.submitted) {
      const footer = document.createElement('div');
      footer.className = 'q-footer';
      const btn = document.createElement('button');
      btn.className = 'btn-submit';
      btn.textContent = 'Confirm';
      btn.disabled = s.selected.size === 0;
      btn.addEventListener('click', () => submitQ(qi));
      footer.appendChild(btn);
      card.appendChild(footer);
    }

    container.appendChild(card);
  });
}

function toggleOpt(qi, oi) {
  if (state[qi].submitted) return;
  if (state[qi].selected.has(oi)) state[qi].selected.delete(oi);
  else state[qi].selected.add(oi);
  
  const card = document.getElementById(`card-${qi}`);
  if (card) {
    const optDivs = card.querySelectorAll('.opt');
    if (optDivs[oi]) {
      if (state[qi].selected.has(oi)) optDivs[oi].classList.add('selected');
      else optDivs[oi].classList.remove('selected');
    }
    const submitBtn = card.querySelector('.btn-submit');
    if (submitBtn) submitBtn.disabled = state[qi].selected.size === 0;
  }
}

function submitQ(qi) {
  if (state[qi].submitted) return;
  state[qi].submitted = true;
  const isRight = arraysEqual(state[qi].selected, questions[qi].correct);
  if (isRight) correctCount++; else wrongCount++;
  updateScore();
  renderCard(qi);
  checkFinished();
}

function renderCard(qi) {
  const old = document.getElementById('card-' + qi);
  if (!old) return;
  const temp = document.createElement('div');
  document.getElementById('quiz-container').insertBefore(temp, old);
  old.remove();

  const q = questions[qi];
  const s = state[qi];
  const card = document.createElement('div');
  card.className = 'q-card' + (s.submitted ? (arraysEqual(s.selected, q.correct) ? ' answered-correct' : ' answered-wrong') : '');
  card.id = 'card-' + qi;

  const header = document.createElement('div');
  header.className = 'q-header';
  header.innerHTML = `<span class="q-num">Q${qi+1}</span><span class="q-text">${q.text}</span>`;
  card.appendChild(header);

  const optsDiv = document.createElement('div');
  optsDiv.className = 'options';
  q.opts.forEach((o, oi) => {
    const div = document.createElement('div');
    let cls = 'opt';
    if (s.submitted) {
      const isCorrect = q.correct.includes(oi);
      const isSelected = s.selected.has(oi);
      if (isCorrect) cls += ' revealed-correct';
      else if (isSelected && !isCorrect) cls += ' revealed-wrong';
      else cls += ' dimmed';
    } else if (s.selected.has(oi)) {
      cls += ' selected';
    }
    div.className = cls;
    div.setAttribute('role', 'button');
    div.setAttribute('tabindex', '0');
    div.setAttribute('aria-label', `Option ${labels[oi]}: ${o}`);
    div.innerHTML = `<div class="opt-circle">${labels[oi]}</div> ${o}`;
    if (!s.submitted) {
      div.addEventListener('click', () => toggleOpt(qi, oi));
      div.addEventListener('keypress', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleOpt(qi, oi); } });
    }
    optsDiv.appendChild(div);
  });
  card.appendChild(optsDiv);

  if (s.submitted) {
    const fb = document.createElement('div');
    const isRight = arraysEqual(s.selected, q.correct);
    fb.className = 'q-feedback show ' + (isRight ? 'ok' : 'err');
    fb.innerHTML = isRight
      ? `<span class="icon">✓</span> Correct! Well done.`
      : `<span class="icon">✗</span> Incorrect — The highlighted options are the correct answers.`;
    card.appendChild(fb);
  }

  if (!s.submitted) {
    const footer = document.createElement('div');
    footer.className = 'q-footer';
    const btn = document.createElement('button');
    btn.className = 'btn-submit';
    btn.textContent = 'Confirm';
    btn.disabled = s.selected.size === 0;
    btn.addEventListener('click', () => submitQ(qi));
    footer.appendChild(btn);
    card.appendChild(footer);
  }

  temp.replaceWith(card);
}

function checkFinished() {
  if (state.every(s => s.submitted)) {
    if (timerInterval) clearInterval(timerInterval);
    const pct = Math.round((correctCount / questions.length) * 100);
    document.getElementById('final-pct').textContent = pct + '%';
    let grade = pct >= 90 ? 'Excellent 🏆' : pct >= 75 ? 'Very Good ✨' : pct >= 60 ? 'Good 👍' : 'Keep Studying 📚';
    document.getElementById('final-grade').textContent = grade;
    document.getElementById('final-result').style.display = 'block';
    document.getElementById('final-result').scrollIntoView({ behavior: 'smooth' });
  }
}

function resetQuiz() {
  if (timerInterval) clearInterval(timerInterval);
  state = questions.map(() => ({ selected: new Set(), submitted: false }));
  correctCount = 0;
  wrongCount = 0;
  timerSeconds = 30 * 60;
  updateTimerDisplay();
  document.getElementById('final-result').style.display = 'none';
  updateScore();
  render();
  startTimer();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Initialize
render();
updateScore();
updateTimerDisplay();
startTimer();

// Event listeners
document.getElementById('export-btn').addEventListener('click', exportResults);
document.getElementById('reset-btn').addEventListener('click', resetQuiz);
</script>
