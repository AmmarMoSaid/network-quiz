<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Computer Networks Quiz - Part 3</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* نفس الـ CSS الموجود في quiz1.html */
      :root {
        --navy: #0d1b2a;
        --navy2: #1b2d42;
        --teal: #00c9a7;
        --teal-dim: rgba(0, 201, 167, 0.12);
        --red: #ff4d6d;
        --red-dim: rgba(255, 77, 109, 0.12);
        --gold: #f5a623;
        --white: #f0f4f8;
        --muted: #8899aa;
        --card: #162032;
        --border: rgba(255, 255, 255, 0.07);
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--navy);
        color: var(--white);
        font-family: "DM Sans", sans-serif;
        min-height: 100vh;
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(0, 201, 167, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 201, 167, 0.03) 1px, transparent 1px);
        background-size: 40px 40px;
        pointer-events: none;
        z-index: 0;
      }

      .wrapper {
        position: relative;
        z-index: 1;
        max-width: 860px;
        margin: 0 auto;
        padding: 2rem 1.5rem 4rem;
      }

      .nav-bar {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 60px;
        padding: 0.5rem;
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        margin-bottom: 2rem;
        flex-wrap: wrap;
      }
      .nav-btn {
        background: transparent;
        border: none;
        color: var(--muted);
        font-family: "Syne", sans-serif;
        font-size: 13px;
        font-weight: 600;
        padding: 10px 24px;
        border-radius: 40px;
        cursor: pointer;
        transition: all 0.2s;
        text-decoration: none;
        display: inline-block;
      }
      .nav-btn.active {
        background: var(--teal);
        color: var(--navy);
      }
      .nav-btn:hover:not(.active) {
        background: rgba(0, 201, 167, 0.15);
        color: var(--teal);
      }

      header {
        text-align: center;
        margin-bottom: 3rem;
      }
      .badge-top {
        display: inline-block;
        font-family: "Syne", sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--teal);
        border: 1px solid var(--teal);
        border-radius: 20px;
        padding: 5px 16px;
        margin-bottom: 1.2rem;
      }
      h1 {
        font-family: "Syne", sans-serif;
        font-size: clamp(2rem, 5vw, 3.2rem);
        font-weight: 800;
        line-height: 1.1;
        margin-bottom: 0.6rem;
      }
      h1 span {
        color: var(--teal);
      }
      .subtitle {
        color: var(--muted);
        font-size: 15px;
        font-weight: 300;
      }

      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        margin-bottom: 2rem;
        flex-wrap: wrap;
      }
      .timer-box {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 40px;
        padding: 8px 20px;
        font-family: "Syne", sans-serif;
        font-weight: 700;
        font-size: 1.2rem;
      }
      .timer-box span {
        color: var(--teal);
      }
      .btn-export {
        background: transparent;
        border: 1px solid var(--gold);
        color: var(--gold);
        border-radius: 40px;
        padding: 8px 20px;
        font-family: "Syne", sans-serif;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
      }
      .btn-export:hover {
        background: var(--gold);
        color: var(--navy);
      }

      .scoreboard {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
        margin-bottom: 2rem;
      }
      .score-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 1rem 1.2rem;
        text-align: center;
      }
      .score-card .label {
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .score-card .val {
        font-family: "Syne", sans-serif;
        font-size: 2rem;
        font-weight: 800;
      }
      .score-card.correct .val {
        color: var(--teal);
      }
      .score-card.wrong .val {
        color: var(--red);
      }
      .score-card.total .val {
        color: var(--gold);
      }

      .section-title {
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: "Syne", sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--teal);
        margin: 2.5rem 0 1rem;
      }
      .section-title::before,
      .section-title::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--teal);
        opacity: 0.25;
      }

      .q-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        margin-bottom: 1.2rem;
        overflow: hidden;
        transition: border-color 0.3s;
      }
      .q-card.answered-correct {
        border-color: rgba(0, 201, 167, 0.4);
      }
      .q-card.answered-wrong {
        border-color: rgba(255, 77, 109, 0.3);
      }

      .q-header {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        padding: 1rem 1.2rem;
        border-bottom: 1px solid var(--border);
      }
      .q-num {
        font-family: "Syne", sans-serif;
        font-size: 11px;
        font-weight: 700;
        color: var(--teal);
        background: var(--teal-dim);
        border-radius: 8px;
        padding: 4px 10px;
        white-space: nowrap;
        margin-top: 2px;
        flex-shrink: 0;
      }
      .q-text {
        font-size: 14px;
        font-weight: 500;
        line-height: 1.5;
        color: var(--white);
      }

      .options {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .opt {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 13px 16px;
        border-top: 1px solid var(--border);
        cursor: pointer;
        transition: background 0.2s;
        font-size: 13.5px;
        color: #b0c0d0;
        user-select: none;
      }
      .opt:nth-child(odd) {
        border-right: 1px solid var(--border);
      }
      .opt:hover {
        background: rgba(255, 255, 255, 0.04);
      }
      .opt.selected {
        background: rgba(0, 201, 167, 0.08);
        color: var(--white);
      }
      .opt.revealed-correct {
        background: var(--teal-dim) !important;
        color: var(--teal) !important;
      }
      .opt.revealed-wrong {
        background: var(--red-dim) !important;
        color: var(--red) !important;
      }
      .opt.dimmed {
        opacity: 0.4;
      }

      .opt-circle {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 1.5px solid rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Syne", sans-serif;
        font-size: 11px;
        font-weight: 700;
        flex-shrink: 0;
        transition: all 0.2s;
      }
      .opt.selected .opt-circle {
        border-color: var(--teal);
        color: var(--teal);
      }
      .opt.revealed-correct .opt-circle {
        background: var(--teal);
        border-color: var(--teal);
        color: var(--navy);
      }
      .opt.revealed-wrong .opt-circle {
        background: var(--red);
        border-color: var(--red);
        color: #fff;
      }

      .q-feedback {
        display: none;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        font-size: 13px;
        font-weight: 500;
        border-top: 1px solid var(--border);
      }
      .q-feedback.show {
        display: flex;
      }
      .q-feedback.ok {
        color: var(--teal);
      }
      .q-feedback.err {
        color: var(--red);
      }
      .q-feedback .icon {
        font-size: 16px;
      }

      .q-footer {
        padding: 10px 16px;
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: flex-end;
      }
      .btn-submit {
        background: var(--teal);
        color: var(--navy);
        border: none;
        border-radius: 10px;
        padding: 8px 22px;
        font-family: "Syne", sans-serif;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        cursor: pointer;
        transition:
          opacity 0.2s,
          transform 0.1s;
      }
      .btn-submit:hover {
        opacity: 0.85;
      }
      .btn-submit:active {
        transform: scale(0.97);
      }
      .btn-submit:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      #final-result {
        display: none;
        background: var(--card);
        border: 1px solid var(--teal);
        border-radius: 20px;
        padding: 2.5rem;
        text-align: center;
        margin-top: 2rem;
      }
      #final-result h2 {
        font-family: "Syne", sans-serif;
        font-size: 2rem;
        font-weight: 800;
        margin-bottom: 0.5rem;
      }
      #final-result p {
        color: var(--muted);
        margin-bottom: 1.5rem;
      }
      .big-score {
        font-family: "Syne", sans-serif;
        font-size: 4rem;
        font-weight: 800;
        color: var(--teal);
        line-height: 1;
      }
      .grade-label {
        font-size: 14px;
        color: var(--gold);
        margin-top: 0.5rem;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      .btn-reset {
        margin-top: 1.5rem;
        background: transparent;
        color: var(--teal);
        border: 1.5px solid var(--teal);
        border-radius: 12px;
        padding: 10px 30px;
        font-family: "Syne", sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 1px;
        cursor: pointer;
        transition:
          background 0.2s,
          color 0.2s;
      }
      .btn-reset:hover {
        background: var(--teal);
        color: var(--navy);
      }

      .progress-bar-wrap {
        height: 4px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 2px;
        margin-bottom: 2rem;
        overflow: hidden;
      }
      .progress-bar-fill {
        height: 100%;
        background: var(--teal);
        border-radius: 2px;
        transition: width 0.4s ease;
        width: 0%;
      }

      @media (max-width: 560px) {
        .options {
          grid-template-columns: 1fr;
        }
        .opt:nth-child(odd) {
          border-right: none;
        }
        .scoreboard {
          grid-template-columns: repeat(3, 1fr);
          gap: 0.5rem;
        }
        .score-card .val {
          font-size: 1.5rem;
        }
        .top-bar {
          flex-direction: column;
          align-items: stretch;
        }
        .timer-box,
        .btn-export {
          text-align: center;
          justify-content: center;
        }
        .nav-bar {
          border-radius: 20px;
        }
        .nav-btn {
          padding: 8px 16px;
          font-size: 11px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="nav-bar">
        <a href="index.html" class="nav-btn">📚 Lecture 1</a>
        <a href="quiz2.html" class="nav-btn">🖥️ Lecture 2</a>
        <a href="quiz3.html" class="nav-btn active">🌐Lecture 3</a>
          <a href="quiz4.html" class="nav-btn ">💡Lecture 4</a>
           <a href="quiz5.html" class="nav-btn  ">🛜Lecture 5</a>
      </div>

      <header>
        <div class="badge-top">Lecture 3 · Computer Networks</div>
        <h1>Network <span>Quiz</span></h1>
        <p class="subtitle">
          Part 3: Network Types & Architectures · Select all correct answers ·
          then confirm
        </p>
      </header>

      <div class="top-bar">
        <div class="timer-box">⏱️ <span id="timer-display">30:00</span></div>
        <button class="btn-export" id="export-btn">📎 Export Results</button>
      </div>

      <div class="scoreboard">
        <div class="score-card correct">
          <div class="label">Correct</div>
          <div class="val" id="sc-correct">0</div>
        </div>
        <div class="score-card wrong">
          <div class="label">Wrong</div>
          <div class="val" id="sc-wrong">0</div>
        </div>
        <div class="score-card total">
          <div class="label">Score</div>
          <div class="val" id="sc-score">0%</div>
        </div>
      </div>

      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>

      <div id="quiz-container"></div>
      <div id="final-result">
        <h2>Quiz Complete 🎉</h2>
        <p>Here's how you did</p>
        <div class="big-score" id="final-pct">0%</div>
        <div class="grade-label" id="final-grade">—</div>
        <br />
        <button class="btn-reset" id="reset-btn">↺ Try Again</button>
      </div>
    </div>

    <script>
      // ============================================
      // PART 3: Network Types and Architectures - 30 Questions
      // ============================================
    const questions = [
  {
    section: "🔌 Network Topologies",
    text: "Which of the following are types of 'Physical Topologies' mentioned in the lecture?",
    opts: [
      "Bus Topology",
      "Star Topology",
      "Mesh Topology",
      "Cloud Topology",
    ],
    correct: [0, 1, 2],
    rationale:
      "Bus, Star, and Mesh are fundamental physical topologies. 'Cloud Topology' is not a standard physical topology but rather a representation of external networks (like the internet). ☁️",
  },
  {
    section: "🔌 Network Topologies",
    text: "What are the main characteristics of a 'Bus Topology'?",
    opts: [
      "All nodes are connected to a single central cable (Backbone).",
      "It uses 'Terminators' at both ends of the main cable.",
      "If the central cable fails, the entire network goes down.",
      "Every device is connected to every other device directly.",
    ],
    correct: [0, 1, 2],
    rationale:
      "Bus topology uses a single backbone cable with terminators to prevent signal reflection. A cable failure brings down the whole network. Direct device-to-device connections describe Mesh topology, not Bus. 🚌",
  },
  {
    section: "🔌 Network Topologies",
    text: "Regarding 'Star Topology', which statements are correct?",
    opts: [
      "All devices are connected to a central controller called a Hub or Switch.",
      "It is easy to install and reconfigure.",
      "If one device's cable fails, only that device is affected.",
      "It requires less cabling than a Bus topology.",
    ],
    correct: [0, 1, 2],
    rationale:
      "Star topology uses a central hub/switch, making installation easy and isolating cable failures. However, it requires MORE cabling than Bus topology (each device has its own cable to the hub), not less. ⭐",
  },
  {
    section: "🔌 Network Topologies",
    text: "Why is 'Mesh Topology' considered highly reliable?",
    opts: [
      "Every node has a dedicated point-to-point link to every other node.",
      "It offers 'Fault Tolerance'; if one link fails, data can take another path.",
      "It is very cheap and easy to install.",
      "It provides high privacy and security because messages travel on dedicated lines.",
    ],
    correct: [0, 1, 3],
    rationale:
      "Mesh topology is reliable due to dedicated links and fault tolerance (multiple paths). It provides privacy since messages use dedicated lines. However, it is EXPENSIVE and DIFFICULT to install, not cheap/easy. 🕸️",
  },
  {
    section: "🔌 Network Topologies",
    text: "Which of the following are 'Disadvantages' of Mesh Topology?",
    opts: [
      "High amount of cabling required.",
      "Difficult installation and reconfiguration.",
      "The hardware (I/O ports) required is expensive.",
      "If the central hub fails, the whole network stops.",
    ],
    correct: [0, 1, 2],
    rationale:
      "Mesh topology requires extensive cabling, many I/O ports, and is difficult to install/reconfigure. Central hub failure is a disadvantage of Star topology, not Mesh (Mesh has no central hub). 🔌",
  },
  {
    section: "🔌 Network Topologies",
    text: "Select the correct descriptions for 'Ring' and 'Hybrid' topologies:",
    opts: [
      "In Ring topology, each computer is connected to the next, forming a circle.",
      "In Ring topology, a break in the ring can disable the entire network.",
      "Hybrid topology is a combination of two or more different topologies.",
      "A Tree topology is an example of a Hybrid topology.",
    ],
    correct: [0, 1, 2, 3],
    rationale:
      "Ring topology forms a circle where a break disables the network. Hybrid combines topologies (Tree = Star + Bus). All statements are correct. 💍🔀",
  },
  {
    section: "🔌 Network Topologies",
    text: "In a Bus Topology, what is the role of the 'Terminator'?",
    opts: [
      "It amplifies the signal to reach further.",
      "It is placed at the end of the cable to prevent signal reflection.",
      "It connects the PC to the backbone cable.",
      "It identifies the destination of the data.",
    ],
    correct: [1],
    rationale:
      "Terminators absorb signals at cable ends, preventing reflections that would cause interference. They don't amplify, connect PCs, or identify destinations. 🛑",
  },
  {
    section: "🔌 Network Topologies",
    text: "Which topology requires the formula n(n-1)/2 to calculate the number of physical links for n devices?",
    opts: ["Star Topology", "Mesh Topology", "Bus Topology", "Ring Topology"],
    correct: [1],
    rationale:
      "In full mesh topology, each device connects to every other device. For n devices: each of n devices needs (n-1) connections, but each link counted twice → n(n-1)/2. 📐",
  },
  {
    section: "🔌 Network Topologies",
    text: "In a Mesh topology, if you have 10 devices, which of the following is true about the network structure?",
    opts: [
      "The number of physical links required is 45.",
      "Each device must have 9 Input/Output (I/O) ports.",
      "Every node has a dedicated point-to-point link to every other node.",
      "It uses a central hub to manage the 10 devices.",
    ],
    correct: [0, 1, 2],
    rationale:
      "For 10 devices in full mesh: links = 10×9/2 = 45; each device needs 9 I/O ports. Mesh has NO central hub (that's Star topology). 🔢",
  },
  {
    section: "🔌 Network Topologies",
    text: "Which of these are considered 'Disadvantages' specifically for Bus and Star topologies according to the lecture?",
    opts: [
      "In Bus: A fault or break in the bus cable stops all transmission.",
      "In Star: If the hub fails, the whole system is dead.",
      "In Star: It requires more cabling than a Bus topology.",
      "In Mesh: It provides high privacy and security.",
    ],
    correct: [0, 1, 2],
    rationale:
      "Bus: single point of failure (backbone cable). Star: hub failure kills network, and Star needs MORE cabling than Bus. Mesh's privacy/security is an advantage, not a disadvantage. ⚠️",
  },
  {
    section: "🔌 Network Topologies",
    text: "Analyze the 'Ring Topology' characteristics mentioned in the file:",
    opts: [
      "Each device is incorporated with a repeater.",
      "A signal is passed along the ring in one direction only.",
      "A break in the ring can disable the entire network.",
      "It is much more reliable than a Mesh topology.",
    ],
    correct: [0, 1, 2],
    rationale:
      "Ring topology uses repeaters at each device, unidirectional traffic, and breaks disable the network. Mesh is MORE reliable (fault-tolerant) than Ring, not less. 💍",
  },
  {
    section: "🔌 Network Topologies",
    text: "Why is 'Mesh Topology' described as having high privacy and security?",
    opts: [
      "Because every message travels along a dedicated line.",
      "Because only the intended recipient sees the data.",
      "Because it uses a central controller to filter data.",
      "Because it is easy to monitor all traffic in one cable.",
    ],
    correct: [0, 1],
    rationale:
      "In Mesh, dedicated point-to-point links mean messages are not broadcasted. Only sender and recipient see the data. Central controllers and single-cable monitoring describe other topologies. 🔒",
  },
  {
    section: "🔌 Network Topologies",
    text: "In the context of Topologies, 'Hybrid' means:",
    opts: [
      "Combining two or more different topologies (e.g., Star and Bus).",
      "A network that only uses wireless connections.",
      "A structure that can change its shape automatically.",
      "An example is a Tree topology which combines multiple Star topologies.",
    ],
    correct: [0, 3],
    rationale:
      "Hybrid = combination of two+ topologies. Tree topology (Star + Bus) is a classic example. Wireless-only or self-changing shapes are not definitions of hybrid. 🌳🔀",
  },
  {
    section: "🔌 Network Topologies",
    text: "Based on the 'Mesh Topology' section, what are the specific advantages mentioned?",
    opts: [
      "Each connection can carry its own data load (eliminating traffic problems).",
      "If one link becomes unusable, it does not incapacitate the entire system.",
      "It is the most economical topology in terms of cabling.",
      "It provides high privacy and security.",
    ],
    correct: [0, 1, 3],
    rationale:
      "Mesh advantages: dedicated links (no traffic jams), fault tolerance, and privacy/security. Mesh is the LEAST economical (most cabling), not most economical. 💰❌",
  },
  {
    section: "🔌 Network Topologies",
    text: "According to the 'Bus Topology' description, which components are essential for its setup?",
    opts: [
      "A central controller or Hub.",
      "A single central cable called a 'Backbone'.",
      "Tap and Drop lines to connect nodes to the main cable.",
      "Terminators at both ends of the backbone.",
    ],
    correct: [1, 2, 3],
    rationale:
      "Bus requires: backbone cable, taps/drop lines for connections, and terminators. A central hub is for Star topology, NOT Bus. 🚌",
  },
  {
    section: "🔌 Network Topologies",
    text: "What are the 'Disadvantages' of Star Topology as stated in the file?",
    opts: [
      "It requires more cabling than a Bus topology.",
      "If the central hub fails, the whole system is dead.",
      "It is very difficult to install and reconfigure.",
      "Adding or removing devices is a complex process.",
    ],
    correct: [0, 1],
    rationale:
      "Star disadvantages: more cabling than Bus, and hub is a single point of failure. Star is actually EASY to install/reconfigure (just connect to hub), and adding/removing devices is simple. ⭐⚠️",
  },
  {
    section: "🔌 Network Topologies",
    text: "What is true about 'Ring Topology' based on the text?",
    opts: [
      "Each device is incorporated with a repeater.",
      "A signal is passed along the ring in one direction only, from device to device.",
      "It is easy to install and reconfigure.",
      "A break in the ring can disable the entire network.",
    ],
    correct: [0, 1, 3],
    rationale:
      "Ring uses repeaters at each device, unidirectional traffic, and breaks disable the network. Ring is NOT easy to reconfigure (compared to Star). 💍",
  },
  {
    section: "🔌 Network Topologies vs. Logic",

      const labels = ["A", "B", "C", "D"];
      let state = questions.map(() => ({
        selected: new Set(),
        submitted: false,
      }));
      let correctCount = 0,
        wrongCount = 0;
      let timerSeconds = 30 * 60;
      let timerInterval = null;

      function arraysEqual(a, b) {
        const sa = [...a].sort(),
          sb = [...b].sort();
        return sa.length === sb.length && sa.every((v, i) => v === sb[i]);
      }

      function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
          if (state.every((s) => s.submitted)) return;
          if (timerSeconds <= 0) {
            clearInterval(timerInterval);
            alert("Time's up! Auto-submitting all pending questions.");
            for (let i = 0; i < state.length; i++) {
              if (!state[i].submitted) {
                state[i].submitted = true;
                const isRight = arraysEqual(
                  state[i].selected,
                  questions[i].correct,
                );
                if (isRight) correctCount++;
                else wrongCount++;
              }
            }
            updateScore();
            render();
            checkFinished();
          } else {
            timerSeconds--;
            updateTimerDisplay();
          }
        }, 1000);
      }

      function updateTimerDisplay() {
        const mins = Math.floor(timerSeconds / 60);
        const secs = timerSeconds % 60;
        document.getElementById("timer-display").textContent =
          `${mins.toString().padStart(2, "0")}:${secs.toString().padStart(2, "0")}`;
      }

      function exportResults() {
        const totalAnswered = state.filter((s) => s.submitted).length;
        const percentage =
          totalAnswered === 0
            ? 0
            : Math.round((correctCount / totalAnswered) * 100);
        const finalGrade =
          percentage >= 90
            ? "Excellent"
            : percentage >= 75
              ? "Very Good"
              : percentage >= 60
                ? "Good"
                : "Keep Studying";
        const results = {
          timestamp: new Date().toISOString(),
          quiz: "Part 3: Types & Architectures",
          totalQuestions: questions.length,
          answered: totalAnswered,
          correct: correctCount,
          wrong: wrongCount,
          percentage: percentage,
          grade: finalGrade,
          details: questions.map((q, i) => ({
            question: q.text,
            userAnswers: [...state[i].selected].map(
              (idx) => labels[idx] + ": " + q.opts[idx],
            ),
            correctAnswers: q.correct.map(
              (idx) => labels[idx] + ": " + q.opts[idx],
            ),
            isCorrect: state[i].submitted
              ? arraysEqual(state[i].selected, q.correct)
              : null,
            rationale: q.rationale,
          })),
        };
        const dataStr = JSON.stringify(results, null, 2);
        const blob = new Blob([dataStr], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `quiz_results_part3_${new Date().toISOString().slice(0, 19)}.json`;
        a.click();
        URL.revokeObjectURL(url);
      }

      function updateScore() {
        const done = state.filter((s) => s.submitted).length;
        document.getElementById("sc-correct").textContent = correctCount;
        document.getElementById("sc-wrong").textContent = wrongCount;
        const pct = done === 0 ? 0 : Math.round((correctCount / done) * 100);
        document.getElementById("sc-score").textContent = pct + "%";
        document.getElementById("progress-bar").style.width =
          Math.round((done / questions.length) * 100) + "%";
      }

      function render() {
        const container = document.getElementById("quiz-container");
        container.innerHTML = "";
        let lastSection = null;

        questions.forEach((q, qi) => {
          if (q.section && q.section !== lastSection) {
            lastSection = q.section;
            const sec = document.createElement("div");
            sec.className = "section-title";
            sec.textContent = q.section;
            container.appendChild(sec);
          }

          const s = state[qi];
          const card = document.createElement("div");
          card.className =
            "q-card" +
            (s.submitted
              ? arraysEqual(s.selected, q.correct)
                ? " answered-correct"
                : " answered-wrong"
              : "");
          card.id = "card-" + qi;

          const header = document.createElement("div");
          header.className = "q-header";
          header.innerHTML = `<span class="q-num">Q${qi + 1}</span><span class="q-text">${q.text}</span>`;
          card.appendChild(header);

          const optsDiv = document.createElement("div");
          optsDiv.className = "options";

          q.opts.forEach((o, oi) => {
            const div = document.createElement("div");
            let cls = "opt";
            if (s.submitted) {
              const isCorrect = q.correct.includes(oi);
              const isSelected = s.selected.has(oi);
              if (isCorrect) cls += " revealed-correct";
              else if (isSelected && !isCorrect) cls += " revealed-wrong";
              else cls += " dimmed";
            } else if (s.selected.has(oi)) {
              cls += " selected";
            }
            div.className = cls;
            div.setAttribute("role", "button");
            div.setAttribute("tabindex", "0");
            div.setAttribute("aria-label", `Option ${labels[oi]}: ${o}`);
            div.innerHTML = `<div class="opt-circle">${labels[oi]}</div> ${o}`;
            if (!s.submitted) {
              div.addEventListener("click", () => toggleOpt(qi, oi));
              div.addEventListener("keypress", (e) => {
                if (e.key === "Enter" || e.key === " ") {
                  e.preventDefault();
                  toggleOpt(qi, oi);
                }
              });
            }
            optsDiv.appendChild(div);
          });
          card.appendChild(optsDiv);

          if (s.submitted) {
            const fb = document.createElement("div");
            const isRight = arraysEqual(s.selected, q.correct);
            fb.className = "q-feedback show " + (isRight ? "ok" : "err");
            fb.innerHTML = isRight
              ? `<span class="icon">✓</span> Correct! Well done.`
              : `<span class="icon">✗</span> Incorrect — ${q.rationale || "The highlighted options are the correct answers."}`;
            card.appendChild(fb);
          }

          if (!s.submitted) {
            const footer = document.createElement("div");
            footer.className = "q-footer";
            const btn = document.createElement("button");
            btn.className = "btn-submit";
            btn.textContent = "Confirm";
            btn.disabled = s.selected.size === 0;
            btn.addEventListener("click", () => submitQ(qi));
            footer.appendChild(btn);
            card.appendChild(footer);
          }

          container.appendChild(card);
        });
      }

      function toggleOpt(qi, oi) {
        if (state[qi].submitted) return;
        if (state[qi].selected.has(oi)) state[qi].selected.delete(oi);
        else state[qi].selected.add(oi);

        const card = document.getElementById(`card-${qi}`);
        if (card) {
          const optDivs = card.querySelectorAll(".opt");
          if (optDivs[oi]) {
            if (state[qi].selected.has(oi))
              optDivs[oi].classList.add("selected");
            else optDivs[oi].classList.remove("selected");
          }
          const submitBtn = card.querySelector(".btn-submit");
          if (submitBtn) submitBtn.disabled = state[qi].selected.size === 0;
        }
      }

      function submitQ(qi) {
        if (state[qi].submitted) return;
        state[qi].submitted = true;
        const isRight = arraysEqual(state[qi].selected, questions[qi].correct);
        if (isRight) correctCount++;
        else wrongCount++;
        updateScore();
        renderCard(qi);
        checkFinished();
      }

      function renderCard(qi) {
        const old = document.getElementById("card-" + qi);
        if (!old) return;
        const temp = document.createElement("div");
        document.getElementById("quiz-container").insertBefore(temp, old);
        old.remove();

        const q = questions[qi];
        const s = state[qi];
        const card = document.createElement("div");
        card.className =
          "q-card" +
          (s.submitted
            ? arraysEqual(s.selected, q.correct)
              ? " answered-correct"
              : " answered-wrong"
            : "");
        card.id = "card-" + qi;

        const header = document.createElement("div");
        header.className = "q-header";
        header.innerHTML = `<span class="q-num">Q${qi + 1}</span><span class="q-text">${q.text}</span>`;
        card.appendChild(header);

        const optsDiv = document.createElement("div");
        optsDiv.className = "options";
        q.opts.forEach((o, oi) => {
          const div = document.createElement("div");
          let cls = "opt";
          if (s.submitted) {
            const isCorrect = q.correct.includes(oi);
            const isSelected = s.selected.has(oi);
            if (isCorrect) cls += " revealed-correct";
            else if (isSelected && !isCorrect) cls += " revealed-wrong";
            else cls += " dimmed";
          } else if (s.selected.has(oi)) {
            cls += " selected";
          }
          div.className = cls;
          div.setAttribute("role", "button");
          div.setAttribute("tabindex", "0");
          div.setAttribute("aria-label", `Option ${labels[oi]}: ${o}`);
          div.innerHTML = `<div class="opt-circle">${labels[oi]}</div> ${o}`;
          if (!s.submitted) {
            div.addEventListener("click", () => toggleOpt(qi, oi));
            div.addEventListener("keypress", (e) => {
              if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                toggleOpt(qi, oi);
              }
            });
          }
          optsDiv.appendChild(div);
        });
        card.appendChild(optsDiv);

        if (s.submitted) {
          const fb = document.createElement("div");
          const isRight = arraysEqual(s.selected, q.correct);
          fb.className = "q-feedback show " + (isRight ? "ok" : "err");
          fb.innerHTML = isRight
            ? `<span class="icon">✓</span> Correct! Well done.`
            : `<span class="icon">✗</span> Incorrect — ${q.rationale || "The highlighted options are the correct answers."}`;
          card.appendChild(fb);
        }

        if (!s.submitted) {
          const footer = document.createElement("div");
          footer.className = "q-footer";
          const btn = document.createElement("button");
          btn.className = "btn-submit";
          btn.textContent = "Confirm";
          btn.disabled = s.selected.size === 0;
          btn.addEventListener("click", () => submitQ(qi));
          footer.appendChild(btn);
          card.appendChild(footer);
        }

        temp.replaceWith(card);
      }

      function checkFinished() {
        if (state.every((s) => s.submitted)) {
          if (timerInterval) clearInterval(timerInterval);
          const pct = Math.round((correctCount / questions.length) * 100);
          document.getElementById("final-pct").textContent = pct + "%";
          let grade =
            pct >= 90
              ? "Excellent 🏆"
              : pct >= 75
                ? "Very Good ✨"
                : pct >= 60
                  ? "Good 👍"
                  : "Keep Studying 📚";
          document.getElementById("final-grade").textContent = grade;
          document.getElementById("final-result").style.display = "block";
          document
            .getElementById("final-result")
            .scrollIntoView({ behavior: "smooth" });
        }
      }

      function resetQuiz() {
        if (timerInterval) clearInterval(timerInterval);
        state = questions.map(() => ({
          selected: new Set(),
          submitted: false,
        }));
        correctCount = 0;
        wrongCount = 0;
        timerSeconds = 30 * 60;
        updateTimerDisplay();
        document.getElementById("final-result").style.display = "none";
        updateScore();
        render();
        startTimer();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      render();
      updateScore();
      updateTimerDisplay();
      startTimer();

      document
        .getElementById("export-btn")
        .addEventListener("click", exportResults);
      document.getElementById("reset-btn").addEventListener("click", resetQuiz);
    </script>
  </body>
</html>
